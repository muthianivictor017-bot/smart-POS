services:
  - type: web
    name: atelier-smart-pos
    runtime: node
    buildCommand: npm ci
    preDeployCommand: npm run migrate
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: atelier-smart-pos-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: STORE_REGISTRATION_CODE
        sync: false

databases:
  - name: atelier-smart-pos-db
    databaseName: smartpos
    user: smartpos
