services:
  - type: web
    name: atelier-smart-pos
    runtime: node
    buildCommand: npm ci
    preDeployCommand: npm run migrate
    startCommand: npm start
    # Runs once, after the first successful deploy: provisions the initial
    # organization, location, register, chart of accounts and admin user.
    initialDeployHook: npm run seed
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: atelier-smart-pos-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: STORE_REGISTRATION_CODE
        generateValue: true
      - key: SEED_ADMIN_PASSWORD
        generateValue: true
      - key: SEED_ADMIN_EMAIL
        value: admin@atelier-pos.onrender.com
      - key: CORS_ORIGINS
        sync: false

databases:
  - name: atelier-smart-pos-db
    databaseName: smartpos
    user: smartpos
